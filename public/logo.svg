<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="NIVA — Pregnancy Intelligence Platform">
  <defs>
    <linearGradient id="nivaBloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b7cc4"/>
      <stop offset="55%" stop-color="#7a6bb5"/>
      <stop offset="100%" stop-color="#e08d7a"/>
    </linearGradient>
    <linearGradient id="nivaSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nivaText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b4d8f"/>
      <stop offset="100%" stop-color="#b06a58"/>
    </linearGradient>
  </defs>

  <!-- Monogram -->
  <g transform="translate(2,2) scale(0.958)">
    <rect x="0" y="0" width="96" height="96" rx="26" fill="url(#nivaBloom)"/>
    <rect x="0" y="0" width="96" height="96" rx="26" fill="url(#nivaSheen)"/>
    <path d="M 26 56 C 26 36, 40 26, 48 26 C 62 26, 72 37, 72 50"
          fill="none" stroke="#ffffff" stroke-opacity="0.95"
          stroke-width="9" stroke-linecap="round"/>
    <circle cx="49" cy="59" r="10.5" fill="#fff6ec"/>
    <circle cx="52.5" cy="55.5" r="3.2" fill="#e08d7a" fill-opacity="0.55"/>
  </g>

  <!-- Wordmark (Inter Variable, self-hosted in app context) -->
  <text x="122" y="62" font-family="'Inter Variable', Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="44" font-weight="700" letter-spacing="6" fill="url(#nivaText)">NIVA</text>

  <!-- Persian name (Vazirmatn, self-hosted) -->
  <text x="300" y="60" font-family="'Vazirmatn', sans-serif" font-size="26"
        font-weight="600" fill="#8a7aa8" text-anchor="end">نیوا</text>
</svg>
