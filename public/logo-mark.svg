<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="NIVA monogram">
  <defs>
    <!-- Calm Bloom: sophisticated lavender → muted coral, soft diagonal -->
    <linearGradient id="nivaBloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b7cc4"/>
      <stop offset="55%" stop-color="#7a6bb5"/>
      <stop offset="100%" stop-color="#e08d7a"/>
    </linearGradient>
    <linearGradient id="nivaSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="92" height="92" rx="26" fill="url(#nivaBloom)"/>
  <rect x="2" y="2" width="92" height="92" rx="26" fill="url(#nivaSheen)"/>

  <!-- Cradle arc: the embracing form (mother's arm / cradle) -->
  <path d="M 26 56
           C 26 36, 40 26, 48 26
           C 62 26, 72 37, 72 50"
        fill="none" stroke="#ffffff" stroke-opacity="0.95"
        stroke-width="9" stroke-linecap="round"/>

  <!-- Seed / child dot resting inside the cradle -->
  <circle cx="49" cy="59" r="10.5" fill="#fff6ec"/>
  <circle cx="52.5" cy="55.5" r="3.2" fill="#e08d7a" fill-opacity="0.55"/>
</svg>
